<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${emailSubject}">Subject Placeholder</title>
</head>
<body>
<div>
    Subject: <span th:text="${emailSubject}">Email Subject</span><br/>
    Sender Name: <span th:text="${senderEmailAddress}">sender@email.com</span>
</div>
<br/>
<div>
    Hi <span th:text="${recipientName}">Recipient Name</span>,
</div>
<br/><br/>
<div>
    Request You to please click on below link to verify your email address for electronic bill registration.
    <br/><br/>
    <a th:href="${message}">Click here</a>
    <br/><br/>
    If you did not request this please mail us at
    <a href="mailto:customercare@vodafoneidea.com">customercare@vodafoneidea.com</a>
    <br/><br/>
</div>
<div>
    <br/><br/>
    From,<br/>
    <span th:text="${senderName}">Sender Name</span>
</div>
</body>
</html>
